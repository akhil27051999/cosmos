# Stage-1 local stack: gateway (API) + worker + Postgres + Redis.
# Run from services/gateway:   docker compose up --build
#   API docs:  http://localhost:8000/docs
# The API and the worker are the SAME image, started with different commands.
# (Stage 7 later extracts the worker into its own service.)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: cosmos
      POSTGRES_DB: cosmos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos -d cosmos"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://cosmos:cosmos@postgres:5432/cosmos
      REDIS_URL: redis://redis:6379/0
      APP_ENV: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]   # same image, different entrypoint
    environment:
      DATABASE_URL: postgresql+asyncpg://cosmos:cosmos@postgres:5432/cosmos
      REDIS_URL: redis://redis:6379/0
      APP_ENV: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
