# Stage-2 local stack: gateway (API) + worker + Postgres + Redis + MongoDB.
# Run from services/gateway:   docker compose up --build
#   API docs:  http://localhost:8000/docs
# The API and the worker are the SAME image, started with different commands.
# (Stage 7 later extracts the worker into its own service.)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: cosmos
      POSTGRES_DB: cosmos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos -d cosmos"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongodata:/data/db

  gateway:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://cosmos:cosmos@postgres:5432/cosmos
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: cosmos
      APP_ENV: local
      # Stage 4: edge load-shedding (admission control) on POST /v1/jobs.
      SUBMIT_RATE_PER_SEC: ${SUBMIT_RATE_PER_SEC:-20}
      SUBMIT_BURST: ${SUBMIT_BURST:-40}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]   # same image, different entrypoint
    environment:
      DATABASE_URL: postgresql+asyncpg://cosmos:cosmos@postgres:5432/cosmos
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: cosmos
      APP_ENV: local
      # Stage 3: the worker runs the agent. Choose a provider with LLM_PROVIDER.
      #   Anthropic (default): export ANTHROPIC_API_KEY (optionally AGENT_MODEL).
      #   Groq (FREE, no card): set LLM_PROVIDER=groq and export GROQ_API_KEY
      #     (get one at console.groq.com).
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Stage 4: resilience around the provider call (all optional; sane defaults).
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-0.5}
      BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-5}
      BREAKER_RESET_S: ${BREAKER_RESET_S:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  pgdata:
  mongodata:
