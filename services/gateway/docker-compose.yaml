# Stage-2 local stack: gateway (API) + worker + Postgres + Redis + MongoDB.
# Run from services/gateway:   docker compose up --build
#   API docs:  http://localhost:8000/docs
# The API and the worker are the SAME image, started with different commands.
# (Stage 7 later extracts the worker into its own service.)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: cosmos
      POSTGRES_DB: cosmos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos -d cosmos"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongodata:/data/db

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode
      - dev-container          # sane single-node defaults for local dev
      - --smp
      - "1"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"          # host tools (rpk) reach it here
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 15

  gateway:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://cosmos:cosmos@postgres:5432/cosmos
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: cosmos
      APP_ENV: local
      # Stage 4: edge load-shedding (admission control) on POST /v1/jobs.
      SUBMIT_RATE_PER_SEC: ${SUBMIT_RATE_PER_SEC:-20}
      SUBMIT_BURST: ${SUBMIT_BURST:-40}
      # Stage 6: multi-tenancy. ADMIN_TOKEN guards the admin bootstrap API
      # (create tenants/keys); blank => the admin API is disabled. Export it
      # before `up` to enable:  export ADMIN_TOKEN=dev-admin-secret
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DEFAULT_MONTHLY_QUOTA: ${DEFAULT_MONTHLY_QUOTA:-1000}
      # Stage 7: OAuth2/OIDC JWT auth. Blank secret => JWT disabled (API keys only).
      # export JWT_HS256_SECRET=dev-jwt-secret to accept HS256 bearer tokens.
      JWT_HS256_SECRET: ${JWT_HS256_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      # Stage 7 pt2: where the gateway reaches the worker's gRPC control plane.
      WORKER_GRPC_TARGET: ${WORKER_GRPC_TARGET:-worker:50051}
      # Stage 10: structured logs — "json" (default) or "text" for local reading.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Stage 12: SLO targets surfaced at GET /v1/admin/slo.
      SLO_AVAILABILITY_TARGET: ${SLO_AVAILABILITY_TARGET:-0.99}
      SLO_LATENCY_THRESHOLD_SECONDS: ${SLO_LATENCY_THRESHOLD_SECONDS:-0.5}
      SLO_LATENCY_TARGET: ${SLO_LATENCY_TARGET:-0.95}
      # Stage 12: chaos fault injection (OFF by default; game-day only).
      CHAOS_ENABLED: ${CHAOS_ENABLED:-false}
      CHAOS_FAULT_RATE: ${CHAOS_FAULT_RATE:-0.0}
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]   # same image, different entrypoint
    environment:
      DATABASE_URL: postgresql+asyncpg://cosmos:cosmos@postgres:5432/cosmos
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: cosmos
      APP_ENV: local
      # Stage 3: the worker runs the agent. Choose a provider with LLM_PROVIDER.
      #   Anthropic (default): export ANTHROPIC_API_KEY (optionally AGENT_MODEL).
      #   Groq (FREE, no card): set LLM_PROVIDER=groq and export GROQ_API_KEY
      #     (get one at console.groq.com).
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Stage 4: resilience around the provider call (all optional; sane defaults).
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-0.5}
      BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-5}
      BREAKER_RESET_S: ${BREAKER_RESET_S:-30}
      # Stage 5: event backbone the outbox relay publishes to.
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      # Stage 7 pt2: port the worker's gRPC control plane binds.
      WORKER_GRPC_PORT: ${WORKER_GRPC_PORT:-50051}
    ports:
      - "50051:50051"          # gRPC control plane (for grpcurl/debugging)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redpanda:
        # started (not healthy) — the relay tolerates the broker being briefly
        # unavailable and retries, so we don't block worker startup on it.
        condition: service_started

volumes:
  pgdata:
  mongodata:
