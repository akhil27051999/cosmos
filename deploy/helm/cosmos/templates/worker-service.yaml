apiVersion: v1
kind: Service
metadata:
  name: {{ include "cosmos.fullname" . }}-worker
  labels:
    {{- include "cosmos.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    {{- include "cosmos.selectorLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.config.workerGrpcPort | int }}
      targetPort: grpc
