apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cosmos.fullname" . }}-worker
  labels:
    {{- include "cosmos.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "cosmos.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "cosmos.selectorLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          ports:
            - name: grpc
              containerPort: {{ .Values.config.workerGrpcPort | int }}
          envFrom:
            - configMapRef:
                name: {{ include "cosmos.fullname" . }}-config
            - secretRef:
                name: {{ include "cosmos.secretName" . }}
          # The worker has no HTTP surface; its readiness is "the gRPC control
          # plane is accepting connections" — a TCP check on the gRPC port.
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
