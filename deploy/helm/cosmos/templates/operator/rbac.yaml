{{- if .Values.operator.enabled }}
{{- $fn := include "cosmos.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fn }}-operator
  labels:
    {{- include "cosmos.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fn }}-operator
  labels:
    {{- include "cosmos.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  # The custom resource this operator owns (+ its status subresource).
  - apiGroups: ["cosmos.dev"]
    resources: ["cosmostenants", "cosmostenants/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Write the credentials Secret it provisions.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  # kopf posts Events and reads the CRD schema + namespaces.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fn }}-operator
  labels:
    {{- include "cosmos.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fn }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ $fn }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
