{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cosmos.fullname" . }}-secrets
  labels: {{- include "cosmos.labels" . | nindent 4 }}
type: Opaque
# `stringData` lets us write plain values; k8s base64-encodes them. In real
# deployments prefer secrets.create=false + an externally-managed Secret.
stringData:
  ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
  JWT_HS256_SECRET: {{ .Values.secrets.jwtHs256Secret | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
{{- end }}
