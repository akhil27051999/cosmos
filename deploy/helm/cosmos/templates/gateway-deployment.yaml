apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cosmos.fullname" . }}-gateway
  labels:
    {{- include "cosmos.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  # When the HPA is enabled it owns the replica count, so we omit `replicas`
  # here to avoid fighting it on every reconcile.
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cosmos.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods automatically when the config or secret content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "cosmos.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "cosmos.fullname" . }}-config
            - secretRef:
                name: {{ include "cosmos.secretName" . }}
          # Liveness = "is the process up?" (cheap). Readiness = "can it serve?"
          # (checks its dependencies) — a not-ready pod is pulled from the Service.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
