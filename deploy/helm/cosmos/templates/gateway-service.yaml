apiVersion: v1
kind: Service
metadata:
  name: {{ include "cosmos.fullname" . }}-gateway
  labels:
    {{- include "cosmos.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "cosmos.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
