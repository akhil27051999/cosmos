# Prometheus — scrapes the Cosmos gateway's /metrics and evaluates alert rules.
#
# The gateway runs in the *other* compose project and publishes :8000 on the host,
# so we scrape it via host.docker.internal (mapped to host-gateway in compose for
# Linux parity). No shared docker network needed.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cosmos-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
