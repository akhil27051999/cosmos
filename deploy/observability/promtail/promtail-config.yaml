# Promtail — discovers containers via the Docker socket and ships their stdout
# (the gateway/worker JSON logs) to Loki. The gateway logs in JSON, so in Grafana
# you can parse and filter by fields like correlation_id and http_status.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # container name (strip the leading "/") -> a `container` label to filter on
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
