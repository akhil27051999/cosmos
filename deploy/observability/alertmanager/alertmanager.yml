# Alertmanager — severity-based routing to Slack.
#
# Two receivers, each with its own webhook (a secret in a *_file, not inlined):
#   * severity="page"    -> slack-page  (#cosmos-pages)   : urgent, notify fast + often
#   * everything else    -> slack       (#cosmos-alerts)  : default (warnings, etc.)
# Of the Stage-12 rules: HighErrorRate + GatewayDown are `page`; HighLatencyP95 is
# `warning`. Alerts also always show in the Alertmanager UI (:9093).
global:
  resolve_timeout: 5m

route:
  receiver: slack                  # default receiver for anything not matched below
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    # High-priority page: its own channel, notified faster and re-sent more often.
    - matchers:
        - severity="page"
      receiver: slack-page
      group_wait: 0s
      repeat_interval: 30m
      continue: false

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_api_url
        channel: "#cosmos-alerts"
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts -}}
          *{{ .Labels.severity }}* — {{ .Annotations.summary }}
          {{ with .Annotations.description }}
          {{ . }}{{ end }}
          {{ end }}

  - name: slack-page
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_api_url_page
        channel: "#cosmos-pages"
        send_resolved: true
        title: ':rotating_light: PAGE {{ .Status | toUpper }}: {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts -}}
          *{{ .Labels.severity }}* — {{ .Annotations.summary }}
          {{ with .Annotations.description }}
          {{ . }}{{ end }}
          {{ end }}
