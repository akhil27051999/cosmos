# PLG + Prometheus + Alertmanager — runs ALONGSIDE the Cosmos stack.
#
# It scrapes the gateway's /metrics via host.docker.internal:8000 (the gateway is
# published on the host by services/gateway/docker-compose.yaml) and tails all
# container logs via the Docker socket. So: start Cosmos first, then this.
#
#   cd services/gateway && docker compose up -d          # Cosmos
#   cd ../../deploy/observability && docker compose -f docker-compose.observability.yaml up -d
#
# UIs:  Grafana http://localhost:3000  ·  Prometheus :9090  ·  Alertmanager :9093
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so it can scrape the host-published gateway (Linux parity)
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      # Mount the whole dir so alertmanager.yml AND the slack_api_url secret file
      # are both available at /etc/alertmanager.
      - ./alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.8
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # discover + tail containers
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
