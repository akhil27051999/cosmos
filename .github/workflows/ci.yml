name: CI

# Run on every push to main and on every pull request — so a PR shows a green
# check before it merges. `workflow_dispatch` lets you run it manually too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run if a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-tests:
    name: gateway • pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/gateway/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  operator-tests:
    name: operator • pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/operator/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  helm-lint:
    name: helm • lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint the chart
        run: helm lint deploy/helm/cosmos
      - name: Render the chart (catches template errors)
        run: helm template rel deploy/helm/cosmos > /dev/null

